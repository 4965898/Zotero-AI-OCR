<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<hbox id="aiocr-prefs-engine-bar" align="center" style="
    margin-bottom: 10px;
    padding: 8px;
    background-color: #f5f5f5;
    border-radius: 4px;
  ">
  <label data-l10n-id="pref-engine" control="aiocr-engine" style="font-weight: bold" />
  <menulist id="aiocr-engine" flex="1" style="min-width: 200px">
    <menupopup>
      <menuitem value="PP-OCRv6" label="PP-OCRv6 (基础文字识别-最新)" />
      <menuitem value="PP-OCRv5" label="PP-OCRv5 (基础文字识别-旧版)" />
      <menuitem value="PP-StructureV3" label="PP-StructureV3 (文档结构解析)" />
      <menuitem value="PaddleOCR-VL-1.6" label="PaddleOCR-VL-1.6 (增强视觉语言模型)" />
      <menuseparator />
      <menuitem value="MinerU-pipeline" label="MinerU-pipeline (文档解析)" />
      <menuitem value="MinerU-vlm" label="MinerU-vlm (推荐文档解析)" />
      <menuitem value="MinerU-HTML" label="MinerU-HTML (HTML解析)" />
      <menuseparator />
      <menuitem value="AI-OpenAI" label="OpenAI (GPT-4o)" />
      <menuitem value="AI-Gemini" label="Google Gemini" />
      <menuitem value="AI-xAI" label="xAI Grok" />
      <menuitem value="AI-OpenRouter" label="OpenRouter" />
      <menuitem value="AI-SiliconFlow" label="硅基流动" />
      <menuitem value="AI-Doubao" label="豆包" />
      <menuitem value="AI-Zhipu" label="智谱AI" />
      <menuitem value="AI-Alibaba" label="阿里云百炼" />
      <menuitem value="AI-Ollama" label="Ollama (本地)" />
      <menuitem value="AI-Groq" label="Groq" />
      <menuitem value="AI-Infinigence" label="无问芯穹" />
      <menuitem value="AI-Mistral" label="Mistral AI" />
      <menuitem value="AI-ModelScope" label="魔搭" />
      <menuitem value="AI-Intern" label="浦源书生" />
      <menuitem value="AI-MiMo" label="小米 MiMo" />
      <menuitem value="AI-NVIDIA" label="NVIDIA NIM" />
    </menupopup>
  </menulist>
  <label value="  " />
  <label id="aiocr-api-mode-label" data-l10n-id="pref-api-mode" control="aiocr-api-mode"
    style="font-weight: bold; margin-left: 20px" />
  <menulist id="aiocr-api-mode" flex="1" style="min-width: 150px">
    <menupopup>
      <menuitem value="sync" label="同步 API" />
      <menuitem value="async" label="异步 API" />
    </menupopup>
  </menulist>
</hbox>
<tabbox onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })" id="aiocr-prefs-tabbox">
  <tabs id="aiocr-prefs-tabs">
    <tab label="通用设置" id="aiocr-tab-general" />
    <tab label="API 端点管理" id="aiocr-tab-endpoints" />
    <tab label="AI 视觉模型配置" id="aiocr-tab-ai-provider" />
    <tab label="高级识别功能" id="aiocr-tab-advanced" />
    <tab label="自定义引擎" id="aiocr-tab-custom-engines" />
  </tabs>
  <tabpanels>
    <tabpanel>
      <groupbox>
        <label>
          <html:h2 data-l10n-id="pref-general-title"></html:h2>
        </label>
        <hbox align="center">
          <label data-l10n-id="pref-note-naming" control="aiocr-note-naming" style="min-width: 120px" />
          <menulist id="aiocr-note-naming" flex="1">
            <menupopup>
              <menuitem value="default" label="默认 (OCR Result - 引擎名)" />
              <menuitem value="zotero" label="Zotero 命名规则" />
              <menuitem value="custom" label="自定义" />
            </menupopup>
          </menulist>
        </hbox>
        <hbox align="center" id="aiocr-custom-naming-row" hidden="true" style="margin-top: 4px">
          <label value="自定义模板:" style="min-width: 120px" />
          <html:input type="text" id="aiocr-custom-naming-template" flex="1"
            placeholder="{{ firstCreator suffix=' - ' }}{{ year suffix=' - ' }}OCR Result" />
        </hbox>
        <description style="
            color: #666;
            font-size: 11px;
            margin-top: 2px;
            margin-left: 124px;
          ">
          支持变量: {{ firstCreator }}, {{ year }}, {{ title }}, {{ itemType }},
          {{ attachmentTitle }} 等，使用 suffix=' - ' 添加分隔符
        </description>
        <checkbox id="aiocr-auto-ocr" data-l10n-id="pref-auto-ocr" style="margin-top: 10px" />
        <hbox align="center" style="margin-top: 8px">
          <label data-l10n-id="pref-concurrency" control="aiocr-concurrency" style="min-width: 120px" />
          <html:input type="number" id="aiocr-concurrency" min="1" max="10" style="width: 60px" />
        </hbox>
      </groupbox>
    </tabpanel>
    <tabpanel>
      <groupbox>
        <label>
          <html:h2 data-l10n-id="pref-endpoints-title"></html:h2>
        </label>
        <description style="color: #666; font-size: 12px; margin-bottom: 8px">
          管理当前引擎的 API 端点。MinerU 引擎的默认 URL 为
          https://mineru.net，Token 为官网申请的 Bearer Token。
        </description>
        <html:div id="aiocr-endpoints-container" style="
            min-height: 200px;
            border: 1px solid #ccc;
            padding: 8px;
            overflow-y: auto;
            max-height: 300px;
            border-radius: 4px;
          " />
        <hbox pack="center" style="margin-top: 8px">
          <button id="aiocr-endpoint-add" data-l10n-id="pref-endpoints-add"
            style="min-width: 70px; text-align: center" />
          <button id="aiocr-endpoint-edit" data-l10n-id="pref-endpoints-edit"
            style="min-width: 70px; text-align: center" />
          <button id="aiocr-endpoint-delete" data-l10n-id="pref-endpoints-delete"
            style="min-width: 70px; text-align: center" />
          <button id="aiocr-endpoint-set-active" data-l10n-id="pref-endpoints-set-active"
            style="min-width: 80px; text-align: center" />
          <button id="aiocr-endpoint-test" data-l10n-id="pref-endpoints-test"
            style="min-width: 80px; text-align: center" />
        </hbox>
        <groupbox id="aiocr-endpoint-form" hidden="true">
          <hbox align="center">
            <label data-l10n-id="pref-endpoints-name" control="aiocr-endpoint-name" style="min-width: 80px" />
            <html:input type="text" id="aiocr-endpoint-name" flex="1" />
          </hbox>
          <hbox align="center">
            <label data-l10n-id="pref-endpoints-url" control="aiocr-endpoint-url" style="min-width: 80px" />
            <html:input type="text" id="aiocr-endpoint-url" flex="1"
              placeholder="PaddleOCR: https://paddleocr.aistudio-app.com  MinerU: https://mineru.net" />
          </hbox>
          <hbox align="center">
            <label data-l10n-id="pref-endpoints-token" control="aiocr-endpoint-token" style="min-width: 80px" />
            <html:input type="password" id="aiocr-endpoint-token" flex="1" />
          </hbox>
          <hbox pack="center" style="margin-top: 8px">
            <button id="aiocr-endpoint-save" label="OK" style="min-width: 70px" />
            <button id="aiocr-endpoint-cancel" label="Cancel" style="min-width: 70px" />
          </hbox>
        </groupbox>
      </groupbox>
    </tabpanel>
    <tabpanel>
      <groupbox>
        <label>
          <html:h2 data-l10n-id="pref-ai-provider-title"></html:h2>
        </label>
        <description style="color: #666; font-size: 12px; margin-bottom: 8px">
          配置 AI 视觉模型的 API 密钥、模型名称和 API 地址。选择上方 AI
          引擎后在此设置对应服务商的参数。
        </description>
        <hbox align="center" style="margin-bottom: 8px">
          <label value="当前服务商:" style="font-weight: bold; min-width: 100px" />
          <label id="aiocr-ai-provider-name" value="(未选择 AI 引擎)" style="color: #1976d2; font-weight: bold" />
        </hbox>
        <hbox align="center" style="margin-bottom: 6px">
          <label value="API Key:" style="min-width: 100px" />
          <html:input type="password" id="aiocr-ai-api-key" flex="1" placeholder="输入 API Key (Ollama 本地可留空)" />
        </hbox>
        <hbox align="center" style="margin-bottom: 6px">
          <label value="模型名称:" style="min-width: 100px" />
          <html:input type="text" id="aiocr-ai-model" flex="1"
            placeholder="如: gpt-4o, gemini-2.5-flash, glm-4v-flash" />
        </hbox>
        <hbox align="center" style="margin-bottom: 6px">
          <label value="API Base URL:" style="min-width: 100px" />
          <html:input type="text" id="aiocr-ai-api-base" flex="1" placeholder="留空使用默认地址" />
        </hbox>
        <vbox style="margin-bottom: 6px">
          <label value="自定义提示词:" style="min-width: 100px" />
          <html:textarea id="aiocr-ai-custom-prompt" rows="3" flex="1" placeholder="留空使用默认提示词。可自定义 OCR 识别指令，如指定输出格式、语言等"
            style="resize: vertical; font-size: 12px" />
        </vbox>
        <hbox pack="end" style="margin-top: 8px">
          <button id="aiocr-ai-provider-save" label="保存配置" style="min-width: 90px" />
          <button id="aiocr-ai-provider-test" label="测试连接" style="min-width: 90px" />
        </hbox>
        <description id="aiocr-ai-provider-hint" style="color: #999; font-size: 11px; margin-top: 6px">
          提示：AI 视觉模型会将 PDF 逐页渲染为图片后发送给模型识别。OpenAI 和
          OpenRouter 原生支持 PDF 输入，其他服务商需先转图片。
        </description>
      </groupbox>
    </tabpanel>
    <tabpanel>
      <groupbox>
        <label>
          <html:h2 data-l10n-id="pref-advanced-title"></html:h2>
        </label>
        <description data-l10n-id="pref-advanced-description" />
        <html:div id="aiocr-advanced-features-container" />
      </groupbox>
    </tabpanel>
    <tabpanel>
      <groupbox>
        <label>
          <html:h2>自定义 OpenAI 兼容引擎</html:h2>
        </label>
        <description style="color: #666; font-size: 12px; margin-bottom: 8px">
          添加自定义的 OpenAI 兼容 API 引擎。每个引擎可自定义名称、API
          地址、密钥和模型，保存后会出现在引擎下拉菜单中。
        </description>
        <html:div id="aiocr-custom-engines-container" style="
            min-height: 120px;
            border: 1px solid #ccc;
            padding: 8px;
            overflow-y: auto;
            max-height: 250px;
            border-radius: 4px;
          " />
        <hbox pack="center" style="margin-top: 8px">
          <button id="aiocr-custom-engine-add" label="添加引擎" style="min-width: 80px" />
          <button id="aiocr-custom-engine-edit" label="编辑" style="min-width: 70px" />
          <button id="aiocr-custom-engine-delete" label="删除" style="min-width: 70px" />
          <button id="aiocr-custom-engine-test" label="测试连接" style="min-width: 80px" />
        </hbox>
        <groupbox id="aiocr-custom-engine-form" hidden="true">
          <hbox align="center" style="margin-bottom: 6px">
            <label value="引擎名称:" style="min-width: 100px" />
            <html:input type="text" id="aiocr-custom-engine-name" flex="1" placeholder="如: 我的视觉模型" />
          </hbox>
          <hbox align="center" style="margin-bottom: 6px">
            <label value="API 完整地址:" style="min-width: 100px" />
            <html:input type="text" id="aiocr-custom-engine-apiurl" flex="1"
              placeholder="如: https://api.example.com/v1/chat/completions" />
          </hbox>
          <hbox align="center" style="margin-bottom: 6px">
            <label value="API Key:" style="min-width: 100px" />
            <html:input type="password" id="aiocr-custom-engine-apikey" flex="1" placeholder="输入 API Key" />
          </hbox>
          <hbox align="center" style="margin-bottom: 6px">
            <label value="模型名称:" style="min-width: 100px" />
            <html:input type="text" id="aiocr-custom-engine-model" flex="1" placeholder="如: qwen-vl-plus" />
          </hbox>
          <hbox align="center" style="margin-bottom: 6px">
            <label value="最大 Tokens:" style="min-width: 100px" />
            <html:input type="number" id="aiocr-custom-engine-maxtokens" min="256" max="65536" style="width: 80px" />
          </hbox>
          <hbox align="center" style="margin-bottom: 6px">
            <label value="Temperature:" style="min-width: 100px" />
            <html:input type="number" id="aiocr-custom-engine-temperature" min="0" max="1" step="0.1"
              style="width: 80px" />
          </hbox>
          <hbox pack="center" style="margin-top: 8px">
            <button id="aiocr-custom-engine-save" label="保存" style="min-width: 70px" />
            <button id="aiocr-custom-engine-cancel" label="取消" style="min-width: 70px" />
          </hbox>
        </groupbox>
      </groupbox>
    </tabpanel>
  </tabpanels>
</tabbox>
<vbox>
  <html:label data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'></html:label>
  <hbox align="center" style="margin-top: 4px">
    <label value="Developed by 4965898" style="color: #666; font-size: 12px" />
    <label value=" | " style="color: #999; font-size: 12px" />
    <html:a id="aiocr-github-link" class="text-link" href="https://github.com/4965898/Zotero-AI-OCR"
      style="color: -moz-hyperlinktext; text-decoration: underline; cursor: pointer; font-size: 12px">GitHub</html:a>
  </hbox>
</vbox>

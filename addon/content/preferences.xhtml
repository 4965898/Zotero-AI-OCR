<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<hbox
  id="aiocr-prefs-engine-bar"
  align="center"
  style="
    margin-bottom: 10px;
    padding: 8px;
    background-color: #f5f5f5;
    border-radius: 4px;
  "
>
  <label
    data-l10n-id="pref-engine"
    control="aiocr-engine"
    style="font-weight: bold"
  />
  <menulist id="aiocr-engine" flex="1" style="min-width: 200px">
    <menupopup>
      <menuitem value="PP-OCRv6" data-l10n-id="engine-PP-OCRv6" />
      <menuitem value="PP-StructureV3" data-l10n-id="engine-PP-StructureV3" />
      <menuitem
        value="PaddleOCR-VL-1.6"
        data-l10n-id="engine-PaddleOCR-VL-1-6"
      />
      <menuseparator />
      <menuitem value="MinerU-pipeline" data-l10n-id="engine-MinerU-pipeline" />
      <menuitem value="MinerU-vlm" data-l10n-id="engine-MinerU-vlm" />
      <menuitem value="MinerU-HTML" data-l10n-id="engine-MinerU-HTML" />
      <menuitem value="ModelBest-OCR" data-l10n-id="engine-ModelBest-OCR" />
      <menuseparator />
      <menuitem value="AI-OpenAI" data-l10n-id="engine-AI-OpenAI" />
      <menuitem value="AI-Gemini" data-l10n-id="engine-AI-Gemini" />
      <menuitem value="AI-xAI" data-l10n-id="engine-AI-xAI" />
      <menuitem value="AI-OpenRouter" data-l10n-id="engine-AI-OpenRouter" />
      <menuitem value="AI-SiliconFlow" data-l10n-id="engine-AI-SiliconFlow" />
      <menuitem value="AI-Doubao" data-l10n-id="engine-AI-Doubao" />
      <menuitem value="AI-Zhipu" data-l10n-id="engine-AI-Zhipu" />
      <menuitem value="AI-Alibaba" data-l10n-id="engine-AI-Alibaba" />
      <menuitem value="AI-Ollama" data-l10n-id="engine-AI-Ollama" />
      <menuitem value="AI-Groq" data-l10n-id="engine-AI-Groq" />
      <menuitem value="AI-Mistral" data-l10n-id="engine-AI-Mistral" />
      <menuitem value="AI-ModelScope" data-l10n-id="engine-AI-ModelScope" />
      <menuitem value="AI-Intern" data-l10n-id="engine-AI-Intern" />
      <menuitem value="AI-MiMo" data-l10n-id="engine-AI-MiMo" />
      <menuitem value="AI-NVIDIA" data-l10n-id="engine-AI-NVIDIA" />
    </menupopup>
  </menulist>
</hbox>
<tabbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
  id="aiocr-prefs-tabbox"
>
  <tabs id="aiocr-prefs-tabs">
    <tab label="通用设置" id="aiocr-tab-general" />
    <tab label="API 端点管理" id="aiocr-tab-endpoints" />
    <tab label="AI 视觉模型配置" id="aiocr-tab-ai-provider" />
    <tab label="高级识别功能" id="aiocr-tab-advanced" />
    <tab label="自定义引擎" id="aiocr-tab-custom-engines" />
  </tabs>
  <tabpanels>
    <tabpanel>
      <groupbox>
        <label>
          <html:h2 data-l10n-id="pref-general-title"></html:h2>
        </label>
        <hbox align="center">
          <label
            data-l10n-id="pref-note-naming"
            control="aiocr-note-naming"
            style="min-width: 120px"
          />
          <menulist id="aiocr-note-naming" flex="1">
            <menupopup>
              <menuitem value="default" label="默认 (OCR Result - 引擎名)" />
              <menuitem value="zotero" label="Zotero 命名规则" />
              <menuitem value="custom" label="自定义" />
            </menupopup>
          </menulist>
        </hbox>
        <hbox
          align="center"
          id="aiocr-custom-naming-row"
          hidden="true"
          style="margin-top: 4px"
        >
          <label value="自定义模板:" style="min-width: 120px" />
          <html:input
            type="text"
            id="aiocr-custom-naming-template"
            flex="1"
            placeholder="{{ firstCreator suffix=' - ' }}{{ year suffix=' - ' }}OCR Result"
          />
        </hbox>
        <description
          style="
            color: #666;
            font-size: 11px;
            margin-top: 2px;
            margin-left: 124px;
          "
        >
          支持变量: {{ firstCreator }}, {{ year }}, {{ title }}, {{ itemType }},
          {{ attachmentTitle }} 等，使用 suffix=' - ' 添加分隔符
        </description>
        <checkbox
          id="aiocr-auto-ocr"
          data-l10n-id="pref-auto-ocr"
          style="margin-top: 10px"
        />
        <hbox align="center" style="margin-top: 8px">
          <label
            data-l10n-id="pref-concurrency"
            control="aiocr-concurrency"
            style="min-width: 120px"
          />
          <html:input
            type="number"
            id="aiocr-concurrency"
            min="1"
            max="10"
            style="width: 60px"
          />
        </hbox>
      </groupbox>
    </tabpanel>
    <tabpanel>
      <groupbox>
        <label>
          <html:h2 data-l10n-id="pref-endpoints-title"></html:h2>
        </label>
        <description style="color: #666; font-size: 12px; margin-bottom: 8px">
          管理当前引擎的 API 端点。MinerU 引擎的默认 URL 为
          https://mineru.net，Token 为官网申请的 Bearer Token。面壁智能引擎的
          URL 为 https://api.modelbest.ai，Token 为开放平台申请的 API Key。
        </description>
        <html:div
          id="aiocr-endpoints-container"
          style="
            min-height: 200px;
            border: 1px solid #ccc;
            padding: 8px;
            overflow-y: auto;
            max-height: 300px;
            border-radius: 4px;
          "
        />
        <hbox pack="center" style="margin-top: 8px">
          <button
            id="aiocr-endpoint-add"
            data-l10n-id="pref-endpoints-add"
            style="min-width: 70px; text-align: center"
          />
          <button
            id="aiocr-endpoint-edit"
            data-l10n-id="pref-endpoints-edit"
            style="min-width: 70px; text-align: center"
          />
          <button
            id="aiocr-endpoint-delete"
            data-l10n-id="pref-endpoints-delete"
            style="min-width: 70px; text-align: center"
          />
          <button
            id="aiocr-endpoint-set-active"
            data-l10n-id="pref-endpoints-set-active"
            style="min-width: 80px; text-align: center"
          />
          <button
            id="aiocr-endpoint-test"
            data-l10n-id="pref-endpoints-test"
            style="min-width: 80px; text-align: center"
          />
        </hbox>
        <groupbox id="aiocr-endpoint-form" hidden="true">
          <hbox align="center">
            <label
              data-l10n-id="pref-endpoints-name"
              control="aiocr-endpoint-name"
              style="min-width: 80px"
            />
            <html:input type="text" id="aiocr-endpoint-name" flex="1" />
          </hbox>
          <hbox align="center">
            <label
              data-l10n-id="pref-endpoints-url"
              control="aiocr-endpoint-url"
              style="min-width: 80px"
            />
            <html:input
              type="text"
              id="aiocr-endpoint-url"
              flex="1"
              placeholder="PaddleOCR: https://paddleocr.aistudio-app.com  MinerU: https://mineru.net  面壁智能: https://api.modelbest.ai"
            />
          </hbox>
          <hbox align="center">
            <label
              data-l10n-id="pref-endpoints-token"
              control="aiocr-endpoint-token"
              style="min-width: 80px"
            />
            <html:input type="password" id="aiocr-endpoint-token" flex="1" />
          </hbox>
          <hbox pack="center" style="margin-top: 8px">
            <button
              id="aiocr-endpoint-save"
              label="OK"
              style="min-width: 70px"
            />
            <button
              id="aiocr-endpoint-cancel"
              label="Cancel"
              style="min-width: 70px"
            />
          </hbox>
        </groupbox>
      </groupbox>
    </tabpanel>
    <tabpanel>
      <groupbox>
        <label>
          <html:h2 data-l10n-id="pref-ai-provider-title"></html:h2>
        </label>
        <description style="color: #666; font-size: 12px; margin-bottom: 8px">
          配置 AI 视觉模型的 API 密钥、模型名称和 API 地址。选择上方 AI
          引擎后在此设置对应服务商的参数。模型名称为可编辑下拉框，会自动从平台获取可用模型列表，也可手动输入。
        </description>
        <hbox align="center" style="margin-bottom: 8px">
          <label
            value="当前服务商:"
            style="font-weight: bold; min-width: 100px"
          />
          <label
            id="aiocr-ai-provider-name"
            value="(未选择 AI 引擎)"
            style="color: #1976d2; font-weight: bold"
          />
        </hbox>
        <hbox align="center" style="margin-bottom: 6px">
          <label value="API Key:" style="min-width: 100px" />
          <html:input
            type="password"
            id="aiocr-ai-api-key"
            flex="1"
            placeholder="输入 API Key (Ollama 本地可留空)"
          />
        </hbox>
        <hbox align="center" style="margin-bottom: 6px">
          <label value="模型名称:" style="min-width: 100px" />
          <menulist
            id="aiocr-ai-model"
            editable="true"
            flex="1"
            style="min-width: 200px"
          >
            <menupopup></menupopup>
          </menulist>
        </hbox>
        <hbox align="center" style="margin-bottom: 6px">
          <label value="API Base URL:" style="min-width: 100px" />
          <html:input
            type="text"
            id="aiocr-ai-api-base"
            flex="1"
            placeholder="留空使用默认地址"
          />
        </hbox>
        <vbox style="margin-bottom: 6px">
          <label value="自定义提示词:" style="min-width: 100px" />
          <html:textarea
            id="aiocr-ai-custom-prompt"
            rows="3"
            flex="1"
            placeholder="留空使用默认提示词。可自定义 OCR 识别指令，如指定输出格式、语言等"
            style="resize: vertical; font-size: 12px"
          />
        </vbox>
        <hbox pack="end" style="margin-top: 8px">
          <button
            id="aiocr-ai-provider-save"
            label="保存配置"
            style="min-width: 90px"
          />
          <button
            id="aiocr-ai-provider-test"
            label="测试连接"
            style="min-width: 90px"
          />
        </hbox>
        <description
          id="aiocr-ai-provider-hint"
          style="color: #999; font-size: 11px; margin-top: 6px"
        >
          提示：AI 视觉模型会将 PDF 逐页渲染为图片后发送给模型识别。OpenAI 和
          OpenRouter 原生支持 PDF 输入，其他服务商需先转图片。
        </description>
      </groupbox>
    </tabpanel>
    <tabpanel>
      <groupbox>
        <label>
          <html:h2 data-l10n-id="pref-advanced-title"></html:h2>
        </label>
        <description data-l10n-id="pref-advanced-description" />
        <html:div id="aiocr-advanced-features-container" />
      </groupbox>
    </tabpanel>
    <tabpanel>
      <groupbox>
        <label>
          <html:h2>自定义 OpenAI 兼容引擎</html:h2>
        </label>
        <description style="color: #666; font-size: 12px; margin-bottom: 8px">
          添加自定义的 OpenAI 兼容 API 引擎。每个引擎可自定义名称、API
          地址、密钥和模型，保存后会出现在引擎下拉菜单中。填好 API
          地址后，模型名称下拉会自动获取该地址下的可用模型列表，也可手动输入。
        </description>
        <html:div
          id="aiocr-custom-engines-container"
          style="
            min-height: 120px;
            border: 1px solid #ccc;
            padding: 8px;
            overflow-y: auto;
            max-height: 250px;
            border-radius: 4px;
          "
        />
        <hbox pack="center" style="margin-top: 8px">
          <button
            id="aiocr-custom-engine-add"
            label="添加引擎"
            style="min-width: 80px"
          />
          <button
            id="aiocr-custom-engine-edit"
            label="编辑"
            style="min-width: 70px"
          />
          <button
            id="aiocr-custom-engine-delete"
            label="删除"
            style="min-width: 70px"
          />
          <button
            id="aiocr-custom-engine-test"
            label="测试连接"
            style="min-width: 80px"
          />
        </hbox>
        <groupbox id="aiocr-custom-engine-form" hidden="true">
          <hbox align="center" style="margin-bottom: 6px">
            <label value="引擎名称:" style="min-width: 100px" />
            <html:input
              type="text"
              id="aiocr-custom-engine-name"
              flex="1"
              placeholder="如: 我的视觉模型"
            />
          </hbox>
          <hbox align="center" style="margin-bottom: 6px">
            <label value="API 完整地址:" style="min-width: 100px" />
            <html:input
              type="text"
              id="aiocr-custom-engine-apiurl"
              flex="1"
              placeholder="如: https://api.example.com/v1/chat/completions"
            />
          </hbox>
          <hbox align="center" style="margin-bottom: 6px">
            <label value="API Key:" style="min-width: 100px" />
            <html:input
              type="password"
              id="aiocr-custom-engine-apikey"
              flex="1"
              placeholder="输入 API Key"
            />
          </hbox>
          <hbox align="center" style="margin-bottom: 6px">
            <label value="模型名称:" style="min-width: 100px" />
            <menulist
              id="aiocr-custom-engine-model"
              editable="true"
              flex="1"
              style="min-width: 200px"
            >
              <menupopup></menupopup>
            </menulist>
          </hbox>
          <hbox align="center" style="margin-bottom: 6px">
            <label value="最大 Tokens:" style="min-width: 100px" />
            <html:input
              type="number"
              id="aiocr-custom-engine-maxtokens"
              min="256"
              max="65536"
              style="width: 80px"
            />
          </hbox>
          <hbox align="center" style="margin-bottom: 6px">
            <label value="Temperature:" style="min-width: 100px" />
            <html:input
              type="number"
              id="aiocr-custom-engine-temperature"
              min="0"
              max="1"
              step="0.1"
              style="width: 80px"
            />
          </hbox>
          <hbox pack="center" style="margin-top: 8px">
            <button
              id="aiocr-custom-engine-save"
              label="保存"
              style="min-width: 70px"
            />
            <button
              id="aiocr-custom-engine-cancel"
              label="取消"
              style="min-width: 70px"
            />
          </hbox>
        </groupbox>
      </groupbox>
    </tabpanel>
  </tabpanels>
</tabbox>
<vbox>
  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
  ></html:label>
  <hbox align="center" style="margin-top: 4px">
    <label value="Developed by 4965898" style="color: #666; font-size: 12px" />
    <label value=" | " style="color: #999; font-size: 12px" />
    <html:a
      id="aiocr-github-link"
      class="text-link"
      href="https://github.com/4965898/Zotero-AI-OCR"
      style="
        color: -moz-hyperlinktext;
        text-decoration: underline;
        cursor: pointer;
        font-size: 12px;
      "
      >GitHub</html:a
    >
  </hbox>
</vbox>
